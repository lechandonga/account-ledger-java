# 测试数据源：内存 H2
spring.datasource.url=jdbc:h2:mem:ledger-test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.hikaricp.leak-detection-threshold=5000
spring.hikaricp.maximum-pool-size=30

ledger.schema.verify=true
ledger.page.default-size=20
ledger.page.max-size=100
