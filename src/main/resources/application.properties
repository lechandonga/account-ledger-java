# 运行期数据源：文件模式 H2（MVStore，行级锁支持并发事务）
spring.datasource.url=jdbc:h2:file:./data/ledger;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway 结构版本化迁移
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 连接池：快速暴露连接泄漏
spring.hikaricp.leak-detection-threshold=10000
spring.hikaricp.maximum-pool-size=20

# 启动时执行结构与约束校验（发现不一致则拒绝启动）
ledger.schema.verify=true

# 流水分页默认/上限
ledger.page.default-size=20
ledger.page.max-size=100
